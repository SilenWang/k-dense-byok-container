[workspace]
name = "k-dense-byok-container"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[tasks]
build = "docker compose build"
up = "docker compose up -d"
up-gpu = "docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d"
up-gpu-ollama = "docker compose -f docker-compose.yml -f docker-compose.gpu.yml --profile ollama up -d"
down = "docker compose down"
logs = "docker compose logs -f"
ps = "docker compose ps"
restart = "docker compose restart"
smoke = "curl -fsS http://localhost:3000 >/dev/null && echo 'UI: OK' && curl -fsS http://localhost:8000/health >/dev/null && echo 'API: OK'"
