services:
  kady:
    build:
      context: .
      dockerfile: Dockerfile
    image: k-dense-byok:local
    container_name: kady-byok
    restart: unless-stopped
    ports:
      # UI — the app's Next.js frontend (default 3000)
      - "${KADY_UI_PORT:-3000}:3000"
      # API — backend Fastify server (expose only if needed, e.g. for health checks)
      - "${KADY_API_PORT:-8000}:8000"
    environment:
      # --- model access ---
      # DeepSeek official API (default model source)
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      # OpenRouter (optional; also powers Fusion presets and speech transcription)
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      OPENROUTER_BASE_URL: "${OPENROUTER_BASE_URL:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      OPENAI_COMPATIBLE_BASE_URL: "${OPENAI_COMPATIBLE_BASE_URL:-}"
      MODAL_TOKEN_ID: "${MODAL_TOKEN_ID:-}"
      MODAL_TOKEN_SECRET: "${MODAL_TOKEN_SECRET:-}"
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:-http://host.docker.internal:11434}"

      # --- model defaults ---
      DEFAULT_MODEL_ID: "${DEFAULT_MODEL_ID:-deepseek-v4-flash-vision-exp}"
      DEFAULT_MODEL_PROVIDER: "${DEFAULT_MODEL_PROVIDER:-deepseek}"

      # --- backend knobs ---
      KADY_HOST: "0.0.0.0"
      KADY_PORT: "8000"
      KADY_PROJECTS_ROOT: "/app/projects"

      # --- browser → API wiring ---
      # Leave NEXT_PUBLIC_ADK_API_URL empty: the UI derives the backend URL
      # from the page's own hostname, so it works whether you open it via
      # localhost, a LAN IP, or a domain. Set it only for custom setups
      # (e.g. a TLS reverse proxy). NEXT_PUBLIC_ADK_API_PORT must be the
      # host-side API port (KADY_API_PORT).
      NEXT_PUBLIC_ADK_API_URL: "${NEXT_PUBLIC_ADK_API_URL:-}"
      NEXT_PUBLIC_ADK_API_PORT: "${KADY_API_PORT:-8000}"

      # --- optional web-access keys ---
      EXA_API_KEY: "${EXA_API_KEY:-}"
      PERPLEXITY_API_KEY: "${PERPLEXITY_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"

      # --- proxy (Node does not pick these up automatically) ---
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      NO_PROXY: "${NO_PROXY:-localhost,127.0.0.1}"

    extra_hosts:
      # Allow the app to reach an Ollama / other service running on the host.
      # Docker Desktop on Linux ≥ 20.10 resolves this to the host gateway IP.
      - "host.docker.internal:host-gateway"

    volumes:
      # Persist projects (conversations, files, notebooks)
      - kady-projects:/app/projects
      # Persist Pi-agent credentials (OAuth tokens), settings, and skills cache
      - kady-home:/root/.kady

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 180s

volumes:
  kady-projects:
  kady-home: